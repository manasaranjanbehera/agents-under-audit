[project]
name = "comms-triage"
version = "0.1.0"
description = "AI-assisted e-communications surveillance triage with prompt-injection quarantine, on AWS Bedrock."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Manasa Ranjan Behera" }]
dependencies = [
  "boto3>=1.35.0",
  "pydantic>=2.9.0",
]

[project.urls]
Repository = "https://github.com/manasaranjanbehera/agents-under-audit"

[project.scripts]
triage = "comms_triage.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comms_triage"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
